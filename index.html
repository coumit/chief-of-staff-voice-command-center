<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis · Chief of Staff</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Neon circuit/light-grid background (purely decorative, behind everything) -->
  <div class="neon-bg" aria-hidden="true">
    <div class="neon-grid"></div>
    <div class="neon-grid neon-grid-2"></div>
    <div class="neon-lines">
      <span class="h"></span><span class="h"></span><span class="h"></span>
      <span class="h"></span><span class="h"></span><span class="h"></span>
      <span class="v"></span><span class="v"></span><span class="v"></span>
      <span class="v"></span><span class="v"></span><span class="v"></span>
    </div>
    <div class="neon-vignette"></div>
  </div>

  <!-- Decorative HUD frame corners -->
  <div class="hud-frame">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </div>

  <!-- ================= LEFT: chat sidebar (running dialogue) ============= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="dot"></span>
      <span class="sidebar-title">JARVIS · TRANSCRIPT</span>
    </div>
    <div class="sidebar-log" id="log" aria-live="polite"></div>
  </aside>

  <!-- ================= TOP-LEFT: clock + capacity gauges ================ -->
  <section class="hud-block clock-block">
    <div class="clock-ring">
      <div class="clock-time" id="teleUptime">00:00:00</div>
    </div>
    <div class="clock-day" id="clockDay">—</div>
    <div class="clock-date" id="clockDate">—</div>
  </section>

  <section class="hud-block capacity-block">
    <div class="cap-row"><span class="cap-label">CORE TEMP</span>
      <span class="cap-val"><span id="teleTemp">22.5</span>&deg;C</span></div>
    <div class="cap-row"><span class="cap-label">SYSTEM LOAD</span>
      <span class="cap-val"><span id="teleLoad">14</span>%</span></div>
    <div class="cap-bar"><i style="width:64%"></i></div>
    <div class="cap-row"><span class="cap-label">STATUS</span>
      <span class="cap-val cap-status" id="statusText">AWAITING<br />COMMAND</span></div>
  </section>

  <!-- ================= MIDDLE-LEFT: AI Developer ring ================== -->
  <section class="hud-block dev-block">
    <div class="dev-ring" id="devRing" title="AI Developer">
      <div class="dev-outer"></div>
      <div class="dev-mid"></div>
      <div class="dev-core"></div>
    </div>
    <div class="dev-caption" id="devCaption">AI DEVELOPER</div>
  </section>

  <!-- ================= TOP-RIGHT: handoff reactor + agent list ========== -->
  <section class="hud-block reactor-block">
    <div class="reactor" id="reactor" title="Agent handoff">
      <div class="reactor-outer"></div>
      <div class="reactor-mid"></div>
      <div class="reactor-core"></div>
    </div>
    <div class="reactor-caption" id="reactorCaption">C-SUITE</div>
  </section>

  <section class="hud-block agents-block">
    <!-- Chief Growth Officer and Marketing & Sales are intentionally omitted
         from this command center. See app.js (routing) and the README. -->
    <div class="agent-item" data-agent="finance">Chief Financial Officer</div>
    <div class="agent-item" data-agent="ux">UX Design Shop</div>
    <div class="agent-item" data-agent="pm">PM Agent</div>
    <div class="agent-item" data-agent="security">Chief Security Officer</div>
    <div class="agent-item" data-agent="quick">Daily Summary</div>
    <div class="agents-owner">COMMAND CENTER</div>
  </section>

  <!-- ================= BOTTOM-LEFT: calendar ring ====================== -->
  <section class="hud-block calendar-block" id="calendarBlock">
    <div class="calendar-ring" id="calendarRing" title="Calendar">
      <svg viewBox="0 0 24 24" class="calendar-icon" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="16" rx="2"/>
        <path d="M3 9h18M8 2.5v4M16 2.5v4"/>
        <path d="M7 13h3M7 16.5h3M13 13h4M13 16.5h4"/>
      </svg>
    </div>
    <div class="calendar-label" id="calendarLabel">CALENDAR</div>
  </section>

  <!-- ================= CENTER: spinning voice wheel ==================== -->
  <main class="center-stage">
    <h1 class="title">CHIEF OF STAFF</h1>

    <div class="dial-wrap">
      <div class="dial-backdrop" aria-hidden="true"></div>
      <div class="dial-ticks" id="dialTicks" aria-hidden="true"></div>
      <div class="dial-core">
        <div class="dial-name" id="dialName">JARVIS</div>
      </div>
    </div>

    <!-- Voice zone: waveform + mic + state (mic sits under the wheel) -->
    <section class="voice-zone">
      <canvas id="waveform" class="waveform"></canvas>
      <div class="mic-row">
        <button class="mic-btn" id="micBtn" aria-label="Toggle listening">
          <svg viewBox="0 0 24 24" class="mic-icon" aria-hidden="true">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
            <path d="M19 12a7 7 0 0 1-14 0M12 19v3"/>
          </svg>
          <span class="mic-rings" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <button class="stop-btn" id="stopBtn" aria-label="Stop speaking" title="Stop">
          <svg viewBox="0 0 24 24" class="stop-icon" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2"/>
          </svg>
        </button>
      </div>
      <div class="listening" id="listeningText">Tap the mic or say &ldquo;Hey Jarvis&rdquo;</div>

      <form class="ask-form" id="askForm">
        <input class="ask-input" id="askInput" type="text"
               placeholder="Type to Coco, or use the mic&hellip;" autocomplete="off" />
        <button class="ask-send" type="submit">Ask</button>
      </form>

      <div class="diag">
        <span class="diag-text" id="diagText">&nbsp;</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
