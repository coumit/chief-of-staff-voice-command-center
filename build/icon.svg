.0" x2="816.8" y2="688.0" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="765.9" y1="706.8" x2="791.3" y2="726.3" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="738.3" y1="738.3" x2="760.9" y2="760.9" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="706.8" y1="765.9" x2="726.3" y2="791.3" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="666.0" y1="778.7" x2="688.0" y2="816.8" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="634.5" y1="807.6" x2="646.7" y2="837.2" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="594.8" y1="821.1" x2="603.1" y2="852.0" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="553.8" y1="829.3" x2="557.9" y2="861.0" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="512.0" y1="820.0" x2="512.0" y2="864.0" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="470.2" y1="829.3" x2="466.1" y2="861.0" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="429.2" y1="821.1" x2="420.9" y2="852.0" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="389.5" y1="807.6" x2="377.3" y2="837.2" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="358.0" y1="778.7" x2="336.0" y2="816.8" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="317.2" y1="765.9" x2="297.7" y2="791.3" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="285.7" y1="738.3" x2="263.1" y2="760.9" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="258.1" y1="706.8" x2="232.7" y2="726.3" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="245.3" y1="666.0" x2="207.2" y2="688.0" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="216.4" y1="634.5" x2="186.8" y2="646.7" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="202.9" y1="594.8" x2="172.0" y2="603.1" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="194.7" y1="553.8" x2="163.0" y2="557.9" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="204.0" y1="512.0" x2="160.0" y2="512.0" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="194.7" y1="470.2" x2="163.0" y2="466.1" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="202.9" y1="429.2" x2="172.0" y2="420.9" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="216.4" y1="389.5" x2="186.8" y2="377.3" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="245.3" y1="358.0" x2="207.2" y2="336.0" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="258.1" y1="317.2" x2="232.7" y2="297.7" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="285.7" y1="285.7" x2="263.1" y2="263.1" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="317.2" y1="258.1" x2="297.7" y2="232.7" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="358.0" y1="245.3" x2="336.0" y2="207.2" stroke="#35d6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/><line x1="389.5" y1="216.4" x2="377.3" y2="186.8" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="429.2" y1="202.9" x2="420.9" y2="172.0" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/><line x1="470.2" y1="194.7" x2="466.1" y2="163.0" stroke="#35d6ff" stroke-width="4" stroke-linecap="round" opacity="0.5"/></g>

  <!-- Faint outer ring -->
  <circle cx="512" cy="512" r="356" fill="none" stroke="#35d6ff" stroke-width="4" opacity="0.3"/>

  <!-- Main neon dial ring: glow underlay + crisp bright ring -->
  <circle cx="512" cy="512" r="288" fill="none" stroke="#35d6ff" stroke-width="26"
          opacity="0.55" filter="url(#blur)"/>
  <circle cx="512" cy="512" r="288" fill="none" stroke="url(#neon)" stroke-width="12"/>
  <circle cx="512" cy="512" r="288" fill="none" stroke="#eafcff" stroke-width="3" opacity="0.9"/>

  <!-- Dashed inner data ring (spoke feel) -->
  <circle cx="512" cy="512" r="228" fill="none" stroke="#35d6ff" stroke-width="6"
          stroke-dasharray="10 26" opacity="0.7" filter="url(#softblur)"/>

  <!-- Small orbiting node on the ring -->
  <circle cx="512" cy="224" r="16" fill="#eafcff" filter="url(#softblur)"/>
  <circle cx="512" cy="224" r="9" fill="#eafcff"/>

  <!-- Core disc -->
  <circle cx="512" cy="512" r="176" fill="url(#core)" stroke="#35d6ff" stroke-width="10"/>
  <circle cx="512" cy="512" r="176" fill="none" stroke="#8af0ff" stroke-width="2" opacity="0.8"/>

  <!-- Neon CoS wordmark: soft glow underlay + bright top -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800"
     text-anchor="middle" letter-spacing="2">
    <text x="512" y="512" font-size="150" fill="#35d6ff" opacity="0.85"
          dominant-baseline="central" filter="url(#blur)">CoS</text>
    <text x="512" y="512" font-size="150" fill="#eafcff"
          dominant-baseline="central">CoS</text>
  </g>
</svg>
