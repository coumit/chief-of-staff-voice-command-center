<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep space background -->
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#04202f"/>
      <stop offset="55%" stop-color="#02121c"/>
      <stop offset="100%" stop-color="#01060b"/>
    </radialGradient>
    <!-- Central cyan bloom -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8af0ff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#35d6ff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#35d6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#35d6ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Neon stroke gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8af0ff"/>
      <stop offset="50%" stop-color="#35d6ff"/>
      <stop offset="100%" stop-color="#1a9fd6"/>
    </linearGradient>
    <!-- Core fill -->
    <radialGradient id="core" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#063243"/>
      <stop offset="100%" stop-color="#02141d"/>
    </radialGradient>
    <!-- Neon glow filter -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="216" fill="none"
        stroke="#35d6ff" stroke-width="3" opacity="0.25"/>

  <!-- Outer bloom behind the dial -->
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>

  <!-- 48 tick marks around the ring (glow copy + crisp copy) -->
  <g id="tickGlow" filter="url(#blur)" opacity="0.7"><line x1="512.0" y1="204.0" x2="512.0" y2="160.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="666.0" y1="245.3" x2="688.0" y2="207.2" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="778.7" y1="358.0" x2="816.8" y2="336.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="820.0" y1="512.0" x2="864.0" y2="512.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="778.7" y1="666.0" x2="816.8" y2="688.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="666.0" y1="778.7" x2="688.0" y2="816.8" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="512.0" y1="820.0" x2="512.0" y2="864.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="358.0" y1="778.7" x2="336.0" y2="816.8" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="245.3" y1="666.0" x2="207.2" y2="688.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="204.0" y1="512.0" x2="160.0" y2="512.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="245.3" y1="358.0" x2="207.2" y2="336.0" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/><line x1="358.0" y1="245.3" x2="336.0" y2="207.2" stroke="#8af0ff" stroke-width="10" stroke-linecap="round"/></g>
